name: Build & deploy to GitHub Pages

on:
  push:
    branches: [production, fabian-branch]
  workflow_dispatch:

# Deploys by pushing the built site to the gh-pages branch. The Actions
# token can't create a Pages site via the API ("Resource not accessible by
# integration"), but GitHub enables Pages automatically for a gh-pages
# branch — no repo-settings step needed.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: SPA fallback for Pages
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/production'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
